<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みさき / ひろ のリンクまとめ</title>
<meta name="description" content="くらしの比較ノート・おかいものびより・noteをまとめたリンクページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EC;
    --coral:#FF8C7A;
    --coral-dim:#FFE3DD;
    --mint:#5FBFA0;
    --mint-dim:#E1F3EC;
    --ink:#4A3B32;
    --ink-dim:#8A7A6E;
    --card:#FFFFFF;
    --line:#F0E4D8;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--cream);}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic Pro','Noto Sans JP',sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 20px 60px;
  }
  .page{ width:100%; max-width:440px; }

  .profile{ text-align:center; margin-bottom:28px; }
  .avatar{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    box-shadow:0 6px 18px rgba(74,59,50,0.15);
  }
  .name{ font-size:20px; font-weight:900; margin-top:14px; }
  .tagline{ font-size:13px; color:var(--ink-dim); margin-top:4px; line-height:1.6; }

  .links{ display:flex; flex-direction:column; gap:14px; margin-top:28px; }
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 3px 10px rgba(74,59,50,0.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(74,59,50,0.10); }
  .card .ic{
    flex-shrink:0;
    width:46px;height:46px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;
  }
  .card.amazon .ic{ background:var(--coral-dim); }
  .card.rakuten .ic{ background:var(--mint-dim); }
  .card.note .ic{ background:#EFEAFB; }
  .card .body{ flex:1; min-width:0; }
  .card .title{ font-size:15px; font-weight:700; }
  .card .desc{ font-size:12px; color:var(--ink-dim); margin-top:3px; line-height:1.5; }
  .card .arrow{ color:var(--ink-dim); font-size:16px; flex-shrink:0; }

  .sns{ display:flex; justify-content:center; gap:16px; margin-top:30px; }
  .sns a{
    width:42px;height:42px;border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink); text-decoration:none; font-size:17px;
  }

  .foot{ text-align:center; font-size:11px; color:var(--ink-dim); margin-top:40px; }
</style>
</head>
<body>

<div class="page">

  <div class="profile">
    <img class="avatar" src="https://assets.st-note.com/production/uploads/images/310587867/profile_69777aac5e1697e7a9502ad0ab9cbbf6.png?width=200" alt="みさき">
    <div class="name">みさき ｜ ひろ</div>
    <div class="tagline">実際のレビューを読み込んで、失敗しないお買い物をまとめています。<br>くらし・楽天セール・日々のメモはこちらから。</div>
  </div>

  <div class="links">
    <a class="card amazon" href="https://hiroai02.github.io/" target="_blank" rel="noopener">
      <div class="ic">🛒</div>
      <div class="body">
        <div class="title">くらしの比較ノート</div>
        <div class="desc">失敗しない日用品選び。サイズ・仕様で徹底比較</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card rakuten" href="https://hiroai02.github.io/okaimono-biyori/" target="_blank" rel="noopener">
      <div class="ic">🛍️</div>
      <div class="body">
        <div class="title">おかいものびより</div>
        <div class="desc">楽天お買い物マラソン・スーパーセール攻略ノート</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card note" href="https://note.com/quiet_dill4282" target="_blank" rel="noopener">
      <div class="ic">📝</div>
      <div class="body">
        <div class="title">note</div>
        <div class="desc">調べたことのメモや、ちょっとした裏話</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="sns">
    <a href="https://x.com/hiroMark02" target="_blank" rel="noopener" aria-label="X">𝕏</a>
  </div>

  <div class="foot">© 2026 みさき / ひろ</div>

</div>

</body>
</html>
