<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みさき / ひろ のリンクまとめ</title>
<meta name="description" content="くらしの比較ノート・おかいものびより・noteをまとめたリンクページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF9184;
    --coral-deep:#FF7A6B;
    --peach:#FFC9A8;
    --mint:#68CDAE;
    --lavender:#C9AEF0;
    --cream:#FFFBF5;
    --ink:#4A3B32;
    --ink-dim:#8A7A6E;
    --glass:rgba(255,255,255,0.60);
    --glass-border:rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic Pro','Noto Sans JP',sans-serif;
    display:flex;
    justify-content:center;
    padding:52px 20px 60px;
    position:relative;
    overflow-x:hidden;
    background:var(--cream);
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }

  /* ---- atmospheric background ---- */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    z-index:0;
    animation:drift 14s ease-in-out infinite;
  }
  .blob.b1{ width:340px;height:340px; background:var(--peach); top:-80px; left:-90px; animation-delay:0s; }
  .blob.b2{ width:300px;height:300px; background:var(--lavender); bottom:-100px; right:-80px; animation-delay:-4s; }
  .blob.b3{ width:220px;height:220px; background:var(--mint); top:38%; right:-60px; opacity:0.4; animation-delay:-8s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(14px,-18px) scale(1.06); }
  }

  .page{ position:relative; z-index:1; width:100%; max-width:420px; }

  /* ---- profile hero ---- */
  .profile{ text-align:center; margin-bottom:32px; opacity:0; animation:rise .6s ease forwards; }
  .avatar-wrap{
    position:relative;
    width:128px;height:128px;
    margin:0 auto;
  }
  .avatar-glow{
    position:absolute; inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 180deg, var(--coral), var(--lavender), var(--mint), var(--coral));
    filter:blur(2px);
    animation:spin 8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    position:absolute; inset:5px;
    width:118px;height:118px;border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    box-shadow:0 10px 26px rgba(74,59,50,0.18);
  }
  .name{ font-size:22px; font-weight:900; margin-top:18px; letter-spacing:.01em; }
  .tagline{ font-size:13px; color:var(--ink-dim); margin-top:6px; line-height:1.7; max-width:320px; margin-left:auto; margin-right:auto; }

  /* ---- link cards (glassmorphism) ---- */
  .links{ display:flex; flex-direction:column; gap:14px; margin-top:30px; }
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--glass);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:16px 18px;
    text-decoration:none;
    color:inherit;
    box-shadow:0 8px 24px rgba(74,59,50,0.08);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    opacity:0; animation:rise .55s ease forwards;
  }
  .card:nth-of-type(1){ animation-delay:.08s; }
  .card:nth-of-type(2){ animation-delay:.16s; }
  .card:nth-of-type(3){ animation-delay:.24s; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 14px 30px rgba(74,59,50,0.14); background:rgba(255,255,255,0.78); }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none; } }

  .card .ic{
    flex-shrink:0;
    width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .card.amazon .ic{ background:linear-gradient(150deg, var(--coral), var(--coral-deep)); }
  .card.rakuten .ic{ background:linear-gradient(150deg, var(--mint), #4bb495); }
  .card.note .ic{ background:linear-gradient(150deg, var(--lavender), #a98be0); }

  .card .body{ flex:1; min-width:0; }
  .card .title{ font-size:15.5px; font-weight:700; }
  .card .desc{ font-size:11.5px; color:var(--ink-dim); margin-top:3px; line-height:1.5; }
  .card .arrow{ color:var(--ink-dim); font-size:17px; flex-shrink:0; transition:transform .18s ease; }
  .card:hover .arrow{ transform:translateX(3px); }

  /* ---- sns row ---- */
  .sns{ display:flex; justify-content:center; gap:14px; margin-top:32px; opacity:0; animation:rise .55s ease .3s forwards; }
  .sns a{
    width:44px;height:44px;border-radius:50%;
    background:var(--glass);
    backdrop-filter:blur(12px);
    border:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink); text-decoration:none; font-size:18px;
    box-shadow:0 6px 16px rgba(74,59,50,0.08);
    transition:transform .18s ease;
  }
  .sns a:hover{ transform:translateY(-3px); }

  .foot{ text-align:center; font-size:11px; color:var(--ink-dim); margin-top:42px; opacity:.85; }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="page">

  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar-glow"></div>
      <img class="avatar" src="https://assets.st-note.com/production/uploads/images/310587867/profile_69777aac5e1697e7a9502ad0ab9cbbf6.png?width=300" alt="みさき">
    </div>
    <div class="name">みさき ｜ ひろ</div>
    <div class="tagline">実際のレビューを読み込んで、失敗しないお買い物をまとめています。<br>くらし・楽天セール・日々のメモはこちらから。</div>
  </div>

  <div class="links">
    <a class="card amazon" href="https://hiroai02.github.io/" target="_blank" rel="noopener">
      <div class="ic">🛒</div>
      <div class="body">
        <div class="title">くらしの比較ノート</div>
        <div class="desc">失敗しない日用品選び。サイズ・仕様で徹底比較</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card rakuten" href="https://hiroai02.github.io/okaimono-biyori/" target="_blank" rel="noopener">
      <div class="ic">🛍️</div>
      <div class="body">
        <div class="title">おかいものびより</div>
        <div class="desc">楽天お買い物マラソン・スーパーセール攻略ノート</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card note" href="https://note.com/quiet_dill4282" target="_blank" rel="noopener">
      <div class="ic">📝</div>
      <div class="body">
        <div class="title">note</div>
        <div class="desc">調べたことのメモや、ちょっとした裏話</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="sns">
    <a href="https://x.com/hiroMark02" target="_blank" rel="noopener" aria-label="X">𝕏</a>
  </div>

  <div class="foot">© 2026 みさき / ひろ</div>

</div>

</body>
</html>
