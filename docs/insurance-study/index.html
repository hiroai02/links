<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="専門課程ドリル">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>生命保険 専門課程ドリル</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--panel:#0e1a30;--text:#f7f9ff;--muted:#91a0bd;--line:#263a5e;--good:#49d7a0;--bad:#ff7187}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
body{background:radial-gradient(circle at 50% -8%,#1a315d 0,#0b1730 30%,#07101f 68%)}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{width:100%;max-width:520px;height:100dvh;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 12px calc(66px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;padding:2px 2px 7px}.eyebrow{color:#95abff;font-size:9px;font-weight:800;letter-spacing:.11em}.title{font-size:20px;font-weight:900;margin-top:2px}.sub{margin-top:2px;color:var(--muted);font-size:10px;line-height:1.35}
.stats{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}.stat{border:1px solid var(--line);background:rgba(14,26,48,.88);border-radius:13px;padding:6px 4px;text-align:center}.stat b{display:block;font-size:17px;line-height:1.1}.stat span{font-size:9px;color:var(--muted)}
.panel{display:none;min-height:0}.panel.active{display:flex;flex:1;min-height:0;flex-direction:column}.panel.scroll{overflow-y:auto;padding-bottom:8px}
.segment{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.seg{border:1px solid var(--line);background:#0e1a30;padding:8px 5px;border-radius:12px;font-size:12px;font-weight:800}.seg.active{background:#203b70;border-color:#5477bd}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,56,.98),rgba(10,20,38,.98));border-radius:21px;padding:13px;box-shadow:0 12px 36px rgba(0,0,0,.24)}
#qCard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.meta{flex:0 0 auto;display:flex;justify-content:space-between;gap:7px;align-items:center}.chip{border:1px solid #334b77;background:#111f39;color:#cad7ff;border-radius:999px;padding:5px 8px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}.counter{font-size:10px;color:var(--muted);white-space:nowrap}
.question{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 2px;text-align:left;font-size:clamp(18px,2.35dvh,22px);line-height:1.48;font-weight:850;overflow:hidden}.question.long{font-size:clamp(17px,2.05dvh,20px);line-height:1.43}.question.xlong{font-size:clamp(16px,1.85dvh,18px);line-height:1.4}
.feedback-slot{flex:0 0 92px;border-top:1px solid rgba(38,58,94,.55);padding:8px 2px 4px;visibility:hidden;overflow:hidden}.feedback-slot.show{visibility:visible}.rtitle{font-size:16px;font-weight:900;line-height:1.2;margin-bottom:3px}.rtitle.good{color:var(--good)}.rtitle.bad{color:var(--bad)}.answerline{font-size:10px;color:#b8c6e7;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex{font-size:12px;line-height:1.42;color:#e1e7f6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.action-zone{flex:0 0 72px;position:relative;margin-top:5px}.choices,.next-wrap{position:absolute;inset:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:0;border-radius:18px;font-size:31px;font-weight:1000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.yes{background:linear-gradient(180deg,#155342,#103b34)}.no{background:linear-gradient(180deg,#5a2430,#3d1923)}.choice:active,.next:active{transform:scale(.98)}.next-wrap{display:none}.answered .choices{display:none}.answered .next-wrap{display:block}.next{width:100%;height:100%;border:0;background:#294a86;border-radius:18px;font-weight:900;font-size:16px}
.list{display:grid;gap:8px}.row{border:1px solid var(--line);background:#0e1a30;border-radius:15px;padding:11px}.rmeta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px;margin-bottom:5px}.rtext{font-size:13px;line-height:1.5}.badge{color:var(--bad);font-weight:900}.empty{text-align:center;padding:42px 14px;color:var(--muted);line-height:1.7}
.primary{width:100%;border:0;background:#294a86;border-radius:15px;padding:13px;margin-top:10px;font-weight:900}.secondary{width:100%;border:1px solid var(--line);background:#101e36;border-radius:15px;padding:12px;margin-top:8px;font-weight:800}.danger{width:100%;border:1px solid #633445;background:#2b1720;color:#ffc0ca;border-radius:14px;padding:12px;margin-top:16px;font-weight:800}
.scorebox{font-size:14px;line-height:1.9}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{border:1px solid var(--line);background:#101d34;border-radius:14px;padding:11px}.mini b{font-size:20px;display:block}.mini span{font-size:10px;color:var(--muted)}.info{font-size:11px;color:var(--muted);line-height:1.65;margin:11px 3px 0}
nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(6,12,24,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:5px 7px calc(5px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;padding:6px 4px;color:var(--muted);font-size:10px;font-weight:800}.tab b{display:block;font-size:17px;margin-bottom:1px}.tab.active{color:#fff}
@media(max-height:740px){header{padding-bottom:4px}.eyebrow,.sub{display:none}.title{font-size:17px}.stats{margin-bottom:5px}.stat{padding:4px}.stat b{font-size:15px}.segment{margin-bottom:5px}.seg{padding:6px 4px}.card{padding:10px}.feedback-slot{flex-basis:82px;padding-top:5px}.ex{font-size:11px}.action-zone{flex-basis:64px}.question{font-size:17px}.question.long{font-size:16px}.question.xlong{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">LIFE INSURANCE SPECIALIST</div><div class="title">専門課程 過去問ドリル</div><div class="sub">スマホ専用・過去問で確認できた論点のみ</div></header>
<div class="stats"><div class="stat"><b id="answered">0</b><span>回答数</span></div><div class="stat"><b id="rate">--</b><span>正答率</span></div><div class="stat"><b id="wrongCount">0</b><span>要復習</span></div></div>
<section id="study" class="panel active">
<div class="segment"><button class="seg active" data-mode="all">全問題</button><button class="seg" data-mode="wrong">間違いだけ</button></div>
<div class="card" id="qCard">
<div class="meta"><span class="chip" id="source"></span><span class="counter" id="counter"></span></div>
<div class="question" id="question"></div>
<div class="feedback-slot" id="feedback"><div class="rtitle" id="resultTitle"></div><div class="answerline" id="answerLine"></div><div class="ex" id="explanation"></div></div>
<div class="action-zone"><div class="choices"><button class="choice yes" data-answer="true" aria-label="まる">○</button><button class="choice no" data-answer="false" aria-label="ばつ">×</button></div><div class="next-wrap"><button class="next" id="next">次の問題</button></div></div>
</div>
</section>
<section id="mistakes" class="panel scroll"><div id="wrongList" class="list"></div><button class="primary" id="startWrong">間違えた問題だけ解く</button></section>
<section id="scores" class="panel scroll"><div class="card"><div class="scorebox" id="scoreText"></div><div class="scoregrid"><div class="mini"><b id="uniqueAnswered">0</b><span>回答済み問題</span></div><div class="mini"><b id="mastered">0</b><span>復習で正解</span></div></div><button class="secondary" id="restartAll">全問題を最初から見る</button><button class="danger" id="reset">学習履歴を完全リセット</button></div><div class="info">学習履歴はこのスマホのブラウザ内だけに保存されます。NOVAには接続していません。問題は過去問で実際に扱われた論点を、原文転載ではなく○×形式に言い換えています。</div></section>
</div>
<nav><button class="tab active" data-tab="study"><b>◉</b>学習</button><button class="tab" data-tab="mistakes"><b>↻</b>間違い</button><button class="tab" data-tab="scores"><b>▥</b>成績</button></nav>
<script>
const QUESTIONS=[
{id:'26b-1a',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'2024年度末の生命保険の保有契約保険金額（個人保険・個人年金保険・団体保険の合計）は、約1,304兆円である。',answer:true,ex:'○。過去問で扱われた数値は約1,304兆円。'},
{id:'26b-1b',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'20歳代・30歳代の主な死因には自殺、不慮の事故、悪性新生物などがあり、40歳代以上では悪性新生物や心疾患などが上位を占める。',answer:true,ex:'○。過去問で示された年齢別死因の内容。'},
{id:'26b-1c',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'2024年の日本の65歳以上人口の割合は、およそ19％である。',answer:false,ex:'×。過去問で扱われた割合は約29％。'},
{id:'26b-2a',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'被保険者が契約日または復活日から所定期間内に自殺した場合、死亡保険金が支払われないことがある。',answer:true,ex:'○。契約日または復活日から所定期間内の自殺は免責事由として扱われる。'},
{id:'26b-2b',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'死亡保険金受取人が故意に被保険者を死亡させた場合でも、死亡保険金は必ず支払われる。',answer:false,ex:'×。受取人が故意に被保険者を死亡させた場合は、死亡保険金が支払われない場合に該当する。'},
{id:'26b-2c',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'契約者が故意に被保険者を死亡させた場合、死亡保険金は支払われない。',answer:true,ex:'○。過去問で扱われた死亡保険金の免責事由。'},
{id:'26b-3a',src:'2026 4–8月 B・問3',topic:'告知義務',text:'告知義務違反となった事実と保険事故との間にまったく因果関係がないことが証明された場合でも、保険金等は必ず不払いになる。',answer:false,ex:'×。因果関係がまったくないことが証明された場合は、保険金等を支払う扱いがある。'},
{id:'26b-3b',src:'2026 4–8月 B・問3',topic:'告知義務',text:'告知義務違反によって契約を解除した場合でも、解約返戻金があれば契約者に支払われる。',answer:true,ex:'○。過去問で扱われた告知義務違反解除後の取扱い。'},
{id:'25b-1a',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'定期保険特約付養老保険では、死亡・高度障害時の保険金と満期時の満期保険金は必ず同額になる。',answer:false,ex:'×。死亡・高度障害時には養老保険と定期保険特約を合わせた保険金が支払われ、満期保険金とは同額ではない。'},
{id:'25b-1b',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'保証期間付終身年金では、保証期間中は生死にかかわらず年金が支払われ、その後も生存していれば終身にわたり年金が支払われる。',answer:true,ex:'○。保証期間付終身年金について過去問で扱われた内容。'},
{id:'25b-1c',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'特定疾病保障保険では、所定のがん・急性心筋梗塞・脳卒中に該当して特定疾病保険金が支払われても、契約はそのまま継続する。',answer:false,ex:'×。過去問では、特定疾病保険金が支払われた時点で契約が消滅する内容が扱われた。'},
{id:'25b-2a',src:'2025 9–3月 B・問2',topic:'保険料の仕組み',text:'生命表から、各年齢の人が今後平均して何年間生存できるかを示す年数を平均余命といい、0歳の平均余命を平均寿命という。',answer:true,ex:'○。平均余命と平均寿命について過去問で扱われた定義。'},
{id:'23b-1a',src:'2023 9–3月 B・問1',topic:'生活環境の変化',text:'生命保険への加入理由は、人的な勧めだけでなく、自分の希望に合う商品・サービスを自ら選択する方向へ変化している。',answer:true,ex:'○。生活環境の変化として過去問で扱われた内容。'},
{id:'23b-1b',src:'2023 9–3月 B・問1',topic:'生活環境の変化',text:'老後生活は子どもに頼るという考え方が強まり、老後資金準備や介護へのニーズは弱まっている。',answer:false,ex:'×。過去問では、子どもには頼れないという考え方が浸透し、老後資金準備や介護へのニーズが強まっているとされた。'},
{id:'23b-2a',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'予定利率による運用収入見込額より実際の運用収入が多い場合に生じる利益を、利差益という。',answer:true,ex:'○。利差益について過去問で扱われた内容。'},
{id:'23b-2b',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'契約者配当金の額は、保険種類や契約年齢、払込方法、経過年数などに関係なく一律である。',answer:false,ex:'×。配当金額は保険種類、契約年齢、払込方法、経過年数、保険期間、保険金額などで異なる。'},
{id:'23b-2c',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'長期継続契約について、通常配当に加えて特別配当が支払われることがある。',answer:true,ex:'○。過去問で扱われた配当の内容。'},
{id:'23b-3a',src:'2023 9–3月 B・問3',topic:'失効・復活',text:'いったん失効した生命保険契約は、どのような場合でも復活することはできない。',answer:false,ex:'×。所定期間内で健康状態等の条件を満たし、所定手続きを行えば復活できる場合がある。'},
{id:'23b-3b',src:'2023 9–3月 B・問3',topic:'失効・復活',text:'失効した契約を復活するには、告知書の提出、生命保険会社の承諾、未払込保険料の払込みなどが必要になる。',answer:true,ex:'○。復活手続きとして過去問で扱われた内容。'}
];
const KEY='life-specialist-study-v2';
let state=loadState(),mode='all',index=0,currentAnswered=false;
function blankState(){return{answered:0,correct:0,wrong:{},seen:{},mastered:{}}}
function loadState(){try{return Object.assign(blankState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blankState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function pool(){if(mode==='wrong'){const ids=new Set(Object.keys(state.wrong));return QUESTIONS.filter(q=>ids.has(q.id))}return QUESTIONS}
function current(){const p=pool();if(!p.length)return null;if(index>=p.length)index=0;return p[index]}
function renderStats(){document.getElementById('answered').textContent=state.answered;document.getElementById('rate').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'--';document.getElementById('wrongCount').textContent=Object.keys(state.wrong).length;document.getElementById('uniqueAnswered').textContent=Object.keys(state.seen).length;document.getElementById('mastered').textContent=Object.keys(state.mastered).length}
function fitQuestion(q){const el=document.getElementById('question');el.classList.remove('long','xlong');if(q.text.length>78)el.classList.add('xlong');else if(q.text.length>58)el.classList.add('long')}
function renderQuestion(){const p=pool(),q=current(),card=document.getElementById('qCard'),fb=document.getElementById('feedback');currentAnswered=false;card.classList.remove('answered');fb.classList.remove('show');if(!q){document.getElementById('source').textContent='復習';document.getElementById('counter').textContent='0問';document.getElementById('question').textContent='間違えた問題はありません。';document.getElementById('question').className='question';card.classList.add('answered');document.getElementById('next').textContent='全問題に戻る';return}document.getElementById('next').textContent='次の問題';document.getElementById('source').textContent=q.src+'・'+q.topic;document.getElementById('counter').textContent=(index+1)+' / '+p.length;document.getElementById('question').textContent=q.text;fitQuestion(q)}
function answer(value){if(currentAnswered)return;const q=current();if(!q)return;currentAnswered=true;const right=value===q.answer;state.answered++;state.seen[q.id]=true;if(right){state.correct++;if(state.wrong[q.id]){delete state.wrong[q.id];state.mastered[q.id]=true}}else{state.wrong[q.id]={count:(state.wrong[q.id]?.count||0)+1,last:Date.now()}}save();renderStats();document.getElementById('resultTitle').textContent=right?'正解':'不正解';document.getElementById('resultTitle').className='rtitle '+(right?'good':'bad');document.getElementById('answerLine').textContent='正解：'+(q.answer?'○':'×')+'　'+q.topic;document.getElementById('explanation').textContent=q.ex;document.getElementById('feedback').classList.add('show');document.getElementById('qCard').classList.add('answered');renderWrongList();renderScore()}
function nextQuestion(){if(!current()){mode='all';index=0;syncModeButtons();renderQuestion();return}const p=pool();if(!p.length){mode='all';index=0}else{index=(index+1)%p.length}renderQuestion()}
function syncModeButtons(){document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function setMode(m){mode=m;index=0;syncModeButtons();renderQuestion()}
function renderWrongList(){const ids=Object.keys(state.wrong),box=document.getElementById('wrongList');if(!ids.length){box.innerHTML='<div class="empty">現在、要復習の問題はありません。<br>間違えた問題はここへ自動保存されます。</div>';return}box.innerHTML=ids.map(id=>{const q=QUESTIONS.find(x=>x.id===id);if(!q)return'';return'<div class="row"><div class="rmeta"><span>'+q.src+'</span><span class="badge">誤答 '+state.wrong[id].count+'回</span></div><div class="rtext">'+q.text+'</div></div>'}).join('')}
function renderScore(){const pct=state.answered?Math.round(state.correct/state.answered*100):0;document.getElementById('scoreText').innerHTML='<b>総回答数：</b>'+state.answered+'回<br><b>正解：</b>'+state.correct+'回<br><b>正答率：</b>'+(state.answered?pct+'%':'--')+'<br><b>現在の要復習：</b>'+Object.keys(state.wrong).length+'問'}
function showTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));if(id==='mistakes')renderWrongList();if(id==='scores')renderScore()}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer==='true')));document.getElementById('next').addEventListener('click',nextQuestion);document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));document.getElementById('startWrong').addEventListener('click',()=>{setMode('wrong');showTab('study')});document.getElementById('restartAll').addEventListener('click',()=>{setMode('all');showTab('study')});document.getElementById('reset').addEventListener('click',()=>{if(confirm('学習履歴をすべて消しますか？')){state=blankState();save();mode='all';index=0;renderStats();renderWrongList();renderScore();renderQuestion()}});
renderStats();renderWrongList();renderScore();renderQuestion();
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
