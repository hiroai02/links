<div class="app">

</div>

{id:'23b-3b-v',src:'2023 9–3月 B・問3 派生',topic:'失効・復活',text:'失効した契約の復活には、生命保険会社の承諾は必要ない。',answer:false,ex:'×。復活には生命保険会社の承諾などが必要になる。'}
];
const KEY='life-specialist-study-v2';
function blankState(){return{answered:0,correct:0,wrong:{},seen:{},mastered:{},progress:{mode:'all',index:0,questionId:null,updatedAt:null}}}
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');const base=blankState();return{...base,...raw,wrong:raw.wrong||{},seen:raw.seen||{},mastered:raw.mastered||{},progress:{...base.progress,...(raw.progress||{})}}}catch(e){return blankState()}}
let state=loadState(),mode='all',index=0,currentAnswered=false,lastAnswerRemoved=false,activeModeButton='all';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function saveProgress(){const q=current();state.progress={mode,index,questionId:q?q.id:null,updatedAt:Date.now()};save()}
function pool(){if(mode==='wrong'){const ids=new Set(Object.keys(state.wrong));return QUESTIONS.filter(q=>ids.has(q.id))}return QUESTIONS}
function current(){const p=pool();if(!p.length)return null;if(index>=p.length)index=0;return p[index]}
function renderStats(){document.getElementById('answered').textContent=state.answered;document.getElementById('rate').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'--';document.getElementById('wrongCount').textContent=Object.keys(state.wrong).length;document.getElementById('uniqueAnswered').textContent=Object.keys(state.seen).length;document.getElementById('mastered').textContent=Object.keys(state.mastered).length}
function fitQuestion(q){const el=document.getElementById('question');el.classList.remove('long','xlong');if(q.text.length>78)el.classList.add('xlong');else if(q.text.length>58)el.classList.add('long')}
function syncModeButtons(){document.getElementById('allBtn').classList.toggle('active',activeModeButton==='all');document.getElementById('wrongBtn').classList.toggle('active',activeModeButton==='wrong');document.getElementById('resumeBtn').classList.toggle('active',activeModeButton==='resume')}
function renderQuestion(){const p=pool(),q=current(),card=document.getElementById('qCard'),fb=document.getElementById('feedback');currentAnswered=false;lastAnswerRemoved=false;card.classList.remove('answered');fb.classList.remove('show');if(!q){document.getElementById('source').textContent='復習';document.getElementById('counter').textContent='0問';document.getElementById('question').textContent='誤答問題はありません。';document.getElementById('question').className='question';card.classList.add('answered');document.getElementById('next').textContent='全問題に戻る';return}document.getElementById('next').textContent='次の問題';document.getElementById('source').textContent=q.src+'・'+q.topic;document.getElementById('counter').textContent=(index+1)+' / '+p.length;document.getElementById('question').textContent=q.text;fitQuestion(q)}
function answer(value){if(currentAnswered)return;const q=current();if(!q)return;currentAnswered=true;const right=value===q.answer;const wasWrong=!!state.wrong[q.id];state.answered++;state.seen[q.id]=true;if(right){state.correct++;if(wasWrong){delete state.wrong[q.id];state.mastered[q.id]=true;lastAnswerRemoved=mode==='wrong'}}else{state.wrong[q.id]={count:(state.wrong[q.id]?.count||0)+1,last:Date.now()}}saveProgress();renderStats();document.getElementById('resultTitle').textContent=right?'正解':'不正解';document.getElementById('resultTitle').className='rtitle '+(right?'good':'bad');document.getElementById('answerLine').textContent='正解：'+(q.answer?'○':'×')+'　'+q.topic;document.getElementById('explanation').textContent=q.ex;document.getElementById('feedback').classList.add('show');document.getElementById('qCard').classList.add('answered');renderWrongList();renderScore()}
function nextQuestion(){if(!current()){startAll();return}const p=pool();if(!p.length){startAll();return}if(mode==='wrong'&&lastAnswerRemoved){if(index>=p.length)index=0}else{index=(index+1)%p.length}saveProgress();renderQuestion()}
function startAll(){mode='all';index=0;activeModeButton='all';syncModeButtons();saveProgress();renderQuestion()}
function startWrong(){mode='wrong';index=0;activeModeButton='wrong';syncModeButtons();saveProgress();renderQuestion()}
function resumeProgress(){const pr=state.progress||{};mode=pr.mode==='wrong'?'wrong':'all';const p=pool();let restored=0;if(pr.questionId){const found=p.findIndex(q=>q.id===pr.questionId);if(found>=0)restored=found;else restored=Math.min(Number(pr.index)||0,Math.max(0,p.length-1))}else restored=Math.min(Number(pr.index)||0,Math.max(0,p.length-1));index=restored;activeModeButton='resume';syncModeButtons();renderQuestion()}
function renderWrongList(){const ids=Object.keys(state.wrong),box=document.getElementById('wrongList');if(!ids.length){box.innerHTML='<div class="empty">現在、要復習の問題はありません。<br>間違えた問題はここへ自動保存されます。</div>';return}box.innerHTML=ids.map(id=>{const q=QUESTIONS.find(x=>x.id===id);if(!q)return'';return'<div class="row"><div class="rmeta"><span>'+q.src+'</span><span class="badge">誤答 '+state.wrong[id].count+'回</span></div><div class="rtext">'+q.text+'</div></div>'}).join('')}
function renderScore(){const pct=state.answered?Math.round(state.correct/state.answered*100):0;const last=state.progress?.updatedAt?new Date(state.progress.updatedAt).toLocaleString('ja-JP'):'まだありません';document.getElementById('scoreText').innerHTML='<b>総問題数：</b>'+QUESTIONS.length+'問<br><b>総回答数：</b>'+state.answered+'回<br><b>正解：</b>'+state.correct+'回<br><b>正答率：</b>'+(state.answered?pct+'%':'--')+'<br><b>現在の要復習：</b>'+Object.keys(state.wrong).length+'問<br><b>最終保存：</b>'+last}
function showTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));if(id==='mistakes')renderWrongList();if(id==='scores')renderScore()}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer==='true')));
document.getElementById('next').addEventListener('click',nextQuestion);
document.getElementById('allBtn').addEventListener('click',startAll);
document.getElementById('wrongBtn').addEventListener('click',startWrong);
document.getElementById('resumeBtn').addEventListener('click',resumeProgress);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
document.getElementById('startWrong').addEventListener('click',()=>{startWrong();showTab('study')});
document.getElementById('resumeFromScore').addEventListener('click',()=>{resumeProgress();showTab('study')});
document.getElementById('restartAll').addEventListener('click',()=>{startAll();showTab('study')});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('学習履歴をすべて消しますか？')){state=blankState();save();mode='all';index=0;activeModeButton='all';renderStats();renderWrongList();renderScore();syncModeButtons();renderQuestion()}});
renderStats();renderWrongList();renderScore();syncModeButtons();renderQuestion();
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
