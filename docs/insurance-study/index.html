t-size:16px}.question.long{font-size:15px}.question.xlong{font-size:13.5px}.mcq-choice{font-size:10.5px;padding:3px}}</style></head><body><div class="app"><header><div class="eyebrow">LIFE INSURANCE SPECIALIST</div><div class="title">専門課程 合格ドリル</div><div class="sub">弱点自動分析・模試・計算4択・近年論点・進捗自動保存</div></header><div class="stats"><div class="stat"><b id="answered">0</b><span>回答数</span></div><div class="stat"><b id="rate">--</b><span>正答率</span></div><div class="stat"><b id="wrongCount">0</b><span>要復習</span></div></div><section id="study" class="panel active"><div class="segment"><button class="seg pass" data-modebtn="today">今日合格</button><button class="seg mock" data-modebtn="mock">本番模試</button><button class="seg weak" data-modebtn="weak">弱点集中</button><button class="seg" data-modebtn="all">全問題</button><button class="seg" data-modebtn="wrong">誤答問題</button><button class="seg resume" id="resumeBtn">前回の続き</button></div><div class="card" id="qCard"><div class="meta"><span class="chip" id="source"></span><span class="counter" id="counter"></span></div><div class="question" id="question"></div><div class="feedback-slot" id="feedback"><div class="rtitle" id="resultTitle"></div><div class="answerline" id="answerLine"></div><div class="source-ref" id="sourceRef"></div><div class="ex" id="explanation"></div></div><div class="action-zone"><div class="choices"><button class="choice yes" data-answer="true">○</button><button class="choice no" data-answer="false">×</button></div><div class="mcq-choices" id="mcqChoices"></div><div class="next-wrap"><button class="next" id="next">次の問題</button></div></div></div></section><section id="mistakes" class="panel scroll"><div id="wrongList" class="list"></div><button class="primary" id="startWrong">誤答問題をランダムで解く</button></section><section id="scores" class="panel scroll"><div class="card"><div class="scorebox" id="scoreText"></div><div class="scoregrid"><div class="mini"><b id="uniqueAnswered">0</b><span>回答済み問題</span></div><div class="mini"><b id="mastered">0</b><span>復習で正解</span></div></div><div class="diag-title">分野別診断</div><div id="topicDiagnostics"></div><button class="secondary" id="resumeFromScore">前回の続きから再開</button><button class="secondary" id="restartAll">新しいランダム順で全問題</button><button class="danger" id="reset">学習履歴を完全リセット</button></div><div class="info">「今日合格」は弱点・未学習・重点・計算を自動選抜します。「本番模試」は30問で途中の正解を表示せず最後に採点します。合格可能性は学習履歴からの目安で、実際の合否を保証するものではありません。</div></section></div><nav><button class="tab active" data-tab="study"><b>◉</b>学習</button><button class="tab" data-tab="mistakes"><b>↻</b>間違い</button><button class="tab" data-tab="scores"><b>▥</b>成績</button></nav><script src="./questions.js?v=7"></script><script src="./recent-questions.js?v=7"></script><script src="./more-questions.js?v=7"></script><script src="./calc-choices.js?v=7"></script><script src="./app-v7.js?v=7"></script><script src="./latest-sources.js?v=7"></script></body></html>
