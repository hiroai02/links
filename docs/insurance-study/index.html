<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="専門課程ドリル">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>生命保険 専門課程ドリル</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--panel:#0e1a30;--text:#f7f9ff;--muted:#91a0bd;--line:#263a5e;--good:#49d7a0;--bad:#ff7187}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}body{background:radial-gradient(circle at 50% -8%,#1a315d 0,#0b1730 30%,#07101f 68%)}button{font:inherit;color:inherit;touch-action:manipulation}.app{width:100%;max-width:520px;height:100dvh;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 12px calc(66px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}header{flex:0 0 auto;padding:2px 2px 7px}.eyebrow{color:#95abff;font-size:9px;font-weight:800;letter-spacing:.11em}.title{font-size:20px;font-weight:900;margin-top:2px}.sub{margin-top:2px;color:var(--muted);font-size:10px;line-height:1.35}.stats{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}.stat{border:1px solid var(--line);background:rgba(14,26,48,.88);border-radius:13px;padding:6px 4px;text-align:center}.stat b{display:block;font-size:17px;line-height:1.1}.stat span{font-size:9px;color:var(--muted)}.panel{display:none;min-height:0}.panel.active{display:flex;flex:1;min-height:0;flex-direction:column}.panel.scroll{overflow-y:auto;padding-bottom:8px}.segment{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}.seg{border:1px solid var(--line);background:#0e1a30;padding:8px 3px;border-radius:12px;font-size:11px;font-weight:800}.seg.active{background:#203b70;border-color:#5477bd}.seg.resume{background:#16233e}.seg:disabled{opacity:.45}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,56,.98),rgba(10,20,38,.98));border-radius:21px;padding:13px;box-shadow:0 12px 36px rgba(0,0,0,.24)}#qCard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.meta{flex:0 0 auto;display:flex;justify-content:space-between;gap:7px;align-items:center}.chip{border:1px solid #334b77;background:#111f39;color:#cad7ff;border-radius:999px;padding:5px 8px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%}.counter{font-size:10px;color:var(--muted);white-space:nowrap}.question{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 2px;text-align:left;font-size:clamp(18px,2.35dvh,22px);line-height:1.48;font-weight:850;overflow:hidden}.question.long{font-size:clamp(17px,2.05dvh,20px);line-height:1.43}.question.xlong{font-size:clamp(15px,1.85dvh,18px);line-height:1.4}.feedback-slot{flex:0 0 92px;border-top:1px solid rgba(38,58,94,.55);padding:8px 2px 4px;visibility:hidden;overflow:hidden}.feedback-slot.show{visibility:visible}.rtitle{font-size:16px;font-weight:900;line-height:1.2;margin-bottom:3px}.rtitle.good{color:var(--good)}.rtitle.bad{color:var(--bad)}.answerline{font-size:10px;color:#b8c6e7;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex{font-size:12px;line-height:1.42;color:#e1e7f6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.action-zone{flex:0 0 72px;position:relative;margin-top:5px}.choices,.next-wrap{position:absolute;inset:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:0;border-radius:18px;font-size:31px;font-weight:1000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.yes{background:linear-gradient(180deg,#155342,#103b34)}.no{background:linear-gradient(180deg,#5a2430,#3d1923)}.choice:active,.next:active{transform:scale(.98)}.next-wrap{display:none}.answered .choices{display:none}.answered .next-wrap{display:block}.next{width:100%;height:100%;border:0;background:#294a86;border-radius:18px;font-weight:900;font-size:16px}.list{display:grid;gap:8px}.row{border:1px solid var(--line);background:#0e1a30;border-radius:15px;padding:11px}.rmeta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px;margin-bottom:5px}.rtext{font-size:13px;line-height:1.5}.badge{color:var(--bad);font-weight:900}.empty{text-align:center;padding:42px 14px;color:var(--muted);line-height:1.7}.primary{width:100%;border:0;background:#294a86;border-radius:15px;padding:13px;margin-top:10px;font-weight:900}.secondary{width:100%;border:1px solid var(--line);background:#101e36;border-radius:15px;padding:12px;margin-top:8px;font-weight:800}.danger{width:100%;border:1px solid #633445;background:#2b1720;color:#ffc0ca;border-radius:14px;padding:12px;margin-top:16px;font-weight:800}.scorebox{font-size:14px;line-height:1.9}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{border:1px solid var(--line);background:#101d34;border-radius:14px;padding:11px}.mini b{font-size:20px;display:block}.mini span{font-size:10px;color:var(--muted)}.info{font-size:11px;color:var(--muted);line-height:1.65;margin:11px 3px 0}nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(6,12,24,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:5px 7px calc(5px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;padding:6px 4px;color:var(--muted);font-size:10px;font-weight:800}.tab b{display:block;font-size:17px;margin-bottom:1px}.tab.active{color:#fff}@media(max-height:740px){header{padding-bottom:4px}.eyebrow,.sub{display:none}.title{font-size:17px}.stats{margin-bottom:5px}.stat{padding:4px}.stat b{font-size:15px}.segment{margin-bottom:5px}.seg{padding:6px 2px;font-size:10px}.card{padding:10px}.feedback-slot{flex-basis:82px;padding-top:5px}.ex{font-size:11px}.action-zone{flex-basis:64px}.question{font-size:17px}.question.long{font-size:16px}.question.xlong{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">LIFE INSURANCE SPECIALIST</div><div class="title">専門課程 過去問ドリル</div><div class="sub">毎回ランダム・他社/隣接業界を重点出題・進捗自動保存</div></header>
<div class="stats"><div class="stat"><b id="answered">0</b><span>回答数</span></div><div class="stat"><b id="rate">--</b><span>正答率</span></div><div class="stat"><b id="wrongCount">0</b><span>要復習</span></div></div>
<section id="study" class="panel active">
<div class="segment"><button class="seg" id="allBtn">全問題</button><button class="seg" id="wrongBtn">誤答問題</button><button class="seg resume" id="resumeBtn">前回の続き</button></div>
<div class="card" id="qCard"><div class="meta"><span class="chip" id="source"></span><span class="counter" id="counter"></span></div><div class="question" id="question"></div><div class="feedback-slot" id="feedback"><div class="rtitle" id="resultTitle"></div><div class="answerline" id="answerLine"></div><div class="ex" id="explanation"></div></div><div class="action-zone"><div class="choices"><button class="choice yes" data-answer="true" aria-label="まる">○</button><button class="choice no" data-answer="false" aria-label="ばつ">×</button></div><div class="next-wrap"><button class="next" id="next">次の問題</button></div></div></div>
</section>
<section id="mistakes" class="panel scroll"><div id="wrongList" class="list"></div><button class="primary" id="startWrong">誤答問題をランダムで解く</button></section>
<section id="scores" class="panel scroll"><div class="card"><div class="scorebox" id="scoreText"></div><div class="scoregrid"><div class="mini"><b id="uniqueAnswered">0</b><span>回答済み問題</span></div><div class="mini"><b id="mastered">0</b><span>復習で正解</span></div></div><button class="secondary" id="resumeFromScore">前回の続きから再開</button><button class="secondary" id="restartAll">新しいランダム順で全問題</button><button class="danger" id="reset">学習履歴を完全リセット</button></div><div class="info">問題順・現在位置・回答数・正解数・誤答回数・復習済みをこのスマホ内に保存します。全問題は同じ周回で重複せず、隣接業界を多めに混ぜています。</div></section>
</div>
<nav><button class="tab active" data-tab="study"><b>◉</b>学習</button><button class="tab" data-tab="mistakes"><b>↻</b>間違い</button><button class="tab" data-tab="scores"><b>▥</b>成績</button></nav>
<script src="./questions.js?v=4"></script>
<script src="./app.js?v=4"></script>
</body>
</html>
