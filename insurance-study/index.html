<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="専門課程ドリル">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>生命保険 専門課程ドリル</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--panel:#0e1a30;--panel2:#12213b;--text:#f7f9ff;--muted:#91a0bd;--line:#263a5e;--blue:#6f93ff;--good:#49d7a0;--bad:#ff7187;--gold:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#07101f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
body{background:radial-gradient(circle at 50% -5%,#1a315d 0,#0b1730 30%,#07101f 68%);min-height:100dvh}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
header{padding:5px 3px 14px}.eyebrow{color:#95abff;font-size:11px;font-weight:800;letter-spacing:.12em}.title{font-size:25px;font-weight:900;margin-top:5px}.sub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.stat{border:1px solid var(--line);background:rgba(14,26,48,.88);border-radius:17px;padding:11px 6px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}.seg{border:1px solid var(--line);background:#0e1a30;padding:11px 6px;border-radius:14px;font-size:13px;font-weight:800}.seg.active{background:#203b70;border-color:#5477bd}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,56,.98),rgba(10,20,38,.98));border-radius:25px;padding:18px;box-shadow:0 18px 54px rgba(0,0,0,.28)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.chip{border:1px solid #334b77;background:#111f39;color:#cad7ff;border-radius:999px;padding:6px 9px;font-size:11px}.counter{font-size:11px;color:var(--muted)}
.question{font-size:22px;line-height:1.62;font-weight:850;min-height:255px;display:flex;align-items:center;padding:10px 2px 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:0;border-radius:24px;min-height:98px;font-size:39px;font-weight:1000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.yes{background:linear-gradient(180deg,#155342,#103b34)}.no{background:linear-gradient(180deg,#5a2430,#3d1923)}.choice:active{transform:scale(.975)}.choice:disabled{opacity:.42}
.result{display:none;margin-top:14px;border:1px solid var(--line);border-radius:18px;background:#0d182b;padding:15px}.result.show{display:block}.rtitle{font-size:20px;font-weight:900;margin-bottom:7px}.rtitle.good{color:var(--good)}.rtitle.bad{color:var(--bad)}.answerline{font-size:13px;color:#b8c6e7;margin-bottom:7px}.ex{font-size:15px;line-height:1.68;color:#e1e7f6}.next{width:100%;border:0;background:#294a86;border-radius:16px;padding:15px;margin-top:13px;font-weight:900}
.panel{display:none}.panel.active{display:block}.list{display:grid;gap:9px}.row{border:1px solid var(--line);background:#0e1a30;border-radius:17px;padding:13px}.rmeta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-bottom:6px}.rtext{font-size:14px;line-height:1.55}.badge{color:var(--bad);font-weight:900}.empty{text-align:center;padding:48px 15px;color:var(--muted);line-height:1.8}
.primary{width:100%;border:0;background:#294a86;border-radius:17px;padding:15px;margin-top:12px;font-weight:900}.secondary{width:100%;border:1px solid var(--line);background:#101e36;border-radius:17px;padding:14px;margin-top:9px;font-weight:800}.danger{width:100%;border:1px solid #633445;background:#2b1720;color:#ffc0ca;border-radius:15px;padding:13px;margin-top:18px;font-weight:800}
.scorebox{font-size:15px;line-height:2}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.mini{border:1px solid var(--line);background:#101d34;border-radius:16px;padding:13px}.mini b{font-size:22px;display:block}.mini span{font-size:11px;color:var(--muted)}
.info{font-size:12px;color:var(--muted);line-height:1.7;margin:13px 4px 0}.source-note{margin-top:12px;padding:12px;border-radius:14px;background:#0c172a;border:1px solid #243753;color:#9daccc;font-size:11px;line-height:1.65}
nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(6,12,24,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;padding:8px 4px;color:var(--muted);font-size:11px;font-weight:800}.tab b{display:block;font-size:20px;margin-bottom:2px}.tab.active{color:#fff}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">LIFE INSURANCE SPECIALIST</div><div class="title">専門課程 過去問ドリル</div><div class="sub">スマホ専用。過去問で確認できた論点だけを○×に言い換えて出題。</div></header>
<div class="stats"><div class="stat"><b id="answered">0</b><span>回答数</span></div><div class="stat"><b id="rate">--</b><span>正答率</span></div><div class="stat"><b id="wrongCount">0</b><span>要復習</span></div></div>
<section id="study" class="panel active">
<div class="segment"><button class="seg active" data-mode="all">全問題</button><button class="seg" data-mode="wrong">間違いだけ</button></div>
<div class="card" id="qCard">
<div class="meta"><span class="chip" id="source"></span><span class="counter" id="counter"></span></div>
<div class="question" id="question"></div>
<div class="choices" id="choices"><button class="choice yes" data-answer="true" aria-label="まる">○</button><button class="choice no" data-answer="false" aria-label="ばつ">×</button></div>
<div class="result" id="result"><div class="rtitle" id="resultTitle"></div><div class="answerline" id="answerLine"></div><div class="ex" id="explanation"></div><button class="next" id="next">次の問題</button></div>
</div>
<div class="source-note">収録基準：生命保険専門課程の過去問解説で実際に出題されたことを確認できた論点のみ。試験問題の原文転載ではなく、意味を変えない範囲で○×形式に言い換えています。</div>
</section>
<section id="mistakes" class="panel"><div id="wrongList" class="list"></div><button class="primary" id="startWrong">間違えた問題だけ解く</button></section>
<section id="scores" class="panel"><div class="card"><div class="scorebox" id="scoreText"></div><div class="scoregrid"><div class="mini"><b id="uniqueAnswered">0</b><span>回答済み問題</span></div><div class="mini"><b id="mastered">0</b><span>復習で正解</span></div></div><button class="secondary" id="restartAll">全問題を最初から見る</button><button class="danger" id="reset">学習履歴を完全リセット</button></div><div class="info">学習履歴はこのスマホのブラウザ内だけに保存されます。NOVAや外部サーバーには送信しません。</div></section>
</div>
<nav><button class="tab active" data-tab="study"><b>◉</b>学習</button><button class="tab" data-tab="mistakes"><b>↻</b>間違い</button><button class="tab" data-tab="scores"><b>▥</b>成績</button></nav>
<script>
const QUESTIONS=[
{id:'26b-1a',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'2024年度末の生命保険の保有契約保険金額（個人保険・個人年金保険・団体保険の合計）は、約1,304兆円である。',answer:true,ex:'○。過去問で扱われた数値は約1,304兆円。'},
{id:'26b-1b',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'20歳代・30歳代の主な死因には自殺、不慮の事故、悪性新生物などがあり、40歳代以上では悪性新生物や心疾患などが上位を占める。',answer:true,ex:'○。過去問で示された年齢別死因の内容。'},
{id:'26b-1c',src:'2026 4–8月 B・問1',topic:'生命保険の現状',text:'2024年の日本の65歳以上人口の割合は、およそ19％である。',answer:false,ex:'×。過去問で扱われた割合は約29％。'},
{id:'26b-2a',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'被保険者が契約日または復活日から所定期間内に自殺した場合、死亡保険金が支払われないことがある。',answer:true,ex:'○。契約日または復活日から所定期間内の自殺は免責事由として扱われる。'},
{id:'26b-2b',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'死亡保険金受取人が故意に被保険者を死亡させた場合でも、死亡保険金は必ず支払われる。',answer:false,ex:'×。死亡保険金受取人が故意に被保険者を死亡させた場合は、死亡保険金が支払われない場合に該当する。'},
{id:'26b-2c',src:'2026 4–8月 B・問2',topic:'死亡保険金の免責',text:'契約者が故意に被保険者を死亡させた場合、死亡保険金は支払われない。',answer:true,ex:'○。過去問で扱われた死亡保険金の免責事由。'},
{id:'26b-3a',src:'2026 4–8月 B・問3',topic:'告知義務',text:'告知義務違反となった事実と保険事故との間にまったく因果関係がないことが証明された場合でも、保険金等は必ず不払いになる。',answer:false,ex:'×。因果関係がまったくないことが証明された場合は、保険金等を支払う扱いがある。'},
{id:'26b-3b',src:'2026 4–8月 B・問3',topic:'告知義務',text:'告知義務違反によって契約を解除した場合でも、解約返戻金があれば契約者に支払われる。',answer:true,ex:'○。過去問で扱われた告知義務違反解除後の取扱い。'},
{id:'25b-1a',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'定期保険特約付養老保険では、死亡・高度障害時の保険金と満期時の満期保険金は必ず同額になる。',answer:false,ex:'×。死亡・高度障害時には養老保険と定期保険特約を合わせた保険金が支払われ、満期保険金とは同額ではない。'},
{id:'25b-1b',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'保証期間付終身年金では、保証期間中は生死にかかわらず年金が支払われ、その後も生存していれば終身にわたり年金が支払われる。',answer:true,ex:'○。保証期間付終身年金について過去問で扱われた内容。'},
{id:'25b-1c',src:'2025 9–3月 B・問1',topic:'主な保険種類',text:'特定疾病保障保険では、所定のがん・急性心筋梗塞・脳卒中に該当して特定疾病保険金が支払われても、契約はそのまま継続する。',answer:false,ex:'×。過去問では、死亡保険金と同額の特定疾病保険金が生存中に支払われ、その時点で契約が消滅する内容が扱われた。'},
{id:'25b-2a',src:'2025 9–3月 B・問2',topic:'保険料の仕組み',text:'生命表から、各年齢の人が今後平均して何年間生存できるかを示す年数を平均余命といい、0歳の平均余命を平均寿命という。',answer:true,ex:'○。平均余命と平均寿命について過去問で扱われた定義。'},
{id:'23b-1a',src:'2023 9–3月 B・問1',topic:'生活環境の変化',text:'生命保険への加入理由は、人的な勧めだけでなく、自分の希望に合う商品・サービスを自ら選択する方向へ変化している。',answer:true,ex:'○。生活環境の変化として過去問で扱われた内容。'},
{id:'23b-1b',src:'2023 9–3月 B・問1',topic:'生活環境の変化',text:'老後生活は子どもに頼るという考え方が強まり、老後資金準備や介護へのニーズは弱まっている。',answer:false,ex:'×。過去問では、子どもには頼れないという考え方が浸透し、老後資金準備や介護へのニーズが強まっているとされた。'},
{id:'23b-2a',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'予定利率による運用収入見込額より実際の運用収入が多い場合に生じる利益を、利差益という。',answer:true,ex:'○。利差益について過去問で扱われた内容。'},
{id:'23b-2b',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'契約者配当金の額は、保険種類や契約年齢、払込方法、経過年数などに関係なく一律である。',answer:false,ex:'×。配当金額は保険種類、性別、契約年齢、払込方法、経過年数、保険期間、保険金額などで異なる。'},
{id:'23b-2c',src:'2023 9–3月 B・問2',topic:'剰余金と配当金',text:'長期継続契約について、通常配当に加えて特別配当が支払われることがある。',answer:true,ex:'○。過去問で扱われた配当の内容。'},
{id:'23b-3a',src:'2023 9–3月 B・問3',topic:'失効・復活',text:'いったん失効した生命保険契約は、どのような場合でも復活することはできない。',answer:false,ex:'×。所定期間内で健康状態等の条件を満たし、所定手続きを行えば復活できる場合がある。'},
{id:'23b-3b',src:'2023 9–3月 B・問3',topic:'失効・復活',text:'失効した契約を復活するには、告知書の提出、生命保険会社の承諾、未払込保険料の払込みなどが必要になる。',answer:true,ex:'○。復活手続きとして過去問で扱われた内容。'}
];
const KEY='specialistStudyStandaloneV1';
let state=load();let mode='all';let queue=[];let index=0;let locked=false;
function fresh(){return{answered:0,correct:0,wrong:{},seen:{},mastered:{},history:[]}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderStats()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function buildQueue(){queue=mode==='wrong'?QUESTIONS.filter(q=>state.wrong[q.id]):shuffle(QUESTIONS);index=0;showQuestion()}
function current(){return queue[index]}
function showQuestion(){locked=false;const q=current();const qCard=document.getElementById('qCard');const choices=document.getElementById('choices');document.getElementById('result').classList.remove('show');choices.classList.remove('hide');[...choices.querySelectorAll('button')].forEach(b=>b.disabled=false);if(!q){document.getElementById('source').textContent='完了';document.getElementById('counter').textContent='';document.getElementById('question').innerHTML=mode==='wrong'?'復習対象の問題はありません。<br><span style="font-size:14px;color:#91a0bd">間違えた問題はここに自動で入ります。</span>':'このセットは完了です。<br><span style="font-size:14px;color:#91a0bd">「全問題」で再スタートできます。</span>';choices.classList.add('hide');return}document.getElementById('source').textContent=q.src;document.getElementById('counter').textContent=`${index+1} / ${queue.length}`;document.getElementById('question').textContent=q.text}
function answer(value){if(locked||!current())return;locked=true;const q=current();const ok=value===q.answer;state.answered++;state.seen[q.id]=(state.seen[q.id]||0)+1;if(ok){state.correct++;if(state.wrong[q.id]){state.mastered[q.id]=(state.mastered[q.id]||0)+1;delete state.wrong[q.id]}}else{state.wrong[q.id]=(state.wrong[q.id]||0)+1;delete state.mastered[q.id]}state.history.push({id:q.id,ok,at:Date.now()});state.history=state.history.slice(-500);save();const title=document.getElementById('resultTitle');title.textContent=ok?'正解':'不正解 → 復習に保存';title.className='rtitle '+(ok?'good':'bad');document.getElementById('answerLine').textContent='正解：'+(q.answer?'○':'×')+'　｜　'+q.topic;document.getElementById('explanation').textContent=q.ex;document.getElementById('result').classList.add('show');[...document.querySelectorAll('.choice')].forEach(b=>b.disabled=true);renderMistakes();renderScores()}
function next(){index++;showQuestion()}
function renderStats(){document.getElementById('answered').textContent=state.answered;document.getElementById('rate').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'--';document.getElementById('wrongCount').textContent=Object.keys(state.wrong).length}
function renderMistakes(){const box=document.getElementById('wrongList');const rows=QUESTIONS.filter(q=>state.wrong[q.id]);if(!rows.length){box.innerHTML='<div class="empty">間違えた問題はまだありません。<br>不正解になると自動でここへ保存されます。</div>';return}box.innerHTML=rows.map(q=>`<div class="row"><div class="rmeta"><span>${esc(q.src)}・${esc(q.topic)}</span><span class="badge">誤答 ${state.wrong[q.id]}回</span></div><div class="rtext">${esc(q.text)}</div></div>`).join('')}
function renderScores(){const uniq=Object.keys(state.seen).length;const wrong=Object.keys(state.wrong).length;const mastered=Object.keys(state.mastered).length;document.getElementById('uniqueAnswered').textContent=uniq;document.getElementById('mastered').textContent=mastered;document.getElementById('scoreText').innerHTML=`収録問題：<b>${QUESTIONS.length}問</b><br>累計回答：<b>${state.answered}回</b><br>累計正解：<b>${state.correct}回</b><br>現在の要復習：<b>${wrong}問</b>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function switchTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='mistakes')renderMistakes();if(id==='scores')renderScores()}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.answer==='true'));document.getElementById('next').onclick=next;document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b));mode=b.dataset.mode;buildQueue()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById('startWrong').onclick=()=>{mode='wrong';document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x.dataset.mode==='wrong'));switchTab('study');buildQueue()};document.getElementById('restartAll').onclick=()=>{mode='all';document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x.dataset.mode==='all'));switchTab('study');buildQueue()};document.getElementById('reset').onclick=()=>{if(confirm('回答履歴と間違い問題をすべて消しますか？')){state=fresh();save();renderMistakes();renderScores();mode='all';buildQueue()}};
renderStats();renderMistakes();renderScores();buildQueue();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
